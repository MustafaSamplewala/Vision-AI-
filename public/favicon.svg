<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="cyber-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="15" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <circle cx="256" cy="256" r="240" fill="#0E0E12" stroke="url(#cyber-gradient)" stroke-width="12" />
  
  <g filter="url(#glow)">
    <!-- Eye Iris/Lens -->
    <circle cx="256" cy="256" r="100" fill="none" stroke="url(#cyber-gradient)" stroke-width="20" opacity="0.8" />
    <circle cx="256" cy="256" r="40" fill="#ec4899" />
    
    <!-- Cybernetic Details -->
    <path d="M256 96 V 136" stroke="#8b5cf6" stroke-width="8" stroke-linecap="round" />
    <path d="M256 376 V 416" stroke="#8b5cf6" stroke-width="8" stroke-linecap="round" />
    <path d="M96 256 H 136" stroke="#8b5cf6" stroke-width="8" stroke-linecap="round" />
    <path d="M376 256 H 416" stroke="#8b5cf6" stroke-width="8" stroke-linecap="round" />
    
    <!-- Orbiting arcs -->
    <path d="M256 50 A 206 206 0 0 1 462 256" fill="none" stroke="#fff" stroke-width="4" stroke-dasharray="20 40" opacity="0.3" />
    <path d="M256 462 A 206 206 0 0 1 50 256" fill="none" stroke="#fff" stroke-width="4" stroke-dasharray="20 40" opacity="0.3" />
  </g>
</svg>
